[package]
name = "nec_solver"
description = "NEC2 MoM solver: matrix assembly, linear solve, postprocessing (currents, impedance, patterns)"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["cpu"]
cpu = []
gpu = ["dep:nec_accel"]

[dependencies]
nec_model   = { workspace = true }
num-complex = { workspace = true }
nec_accel   = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"
# Parse real decks in the `validate` tests, so the checks are exercised on the
# same NecDeck/Segment pair a frontend actually holds. nec_parser depends only on
# nec_model, so this adds no cycle.
nec_parser = { workspace = true }

[lints]
workspace = true
