name: Mint release tag

# Places the annotated tag for a release, at the commit that actually declares
# that version — and only after verifying that commit deserves it.
#
# WHY THIS IS A BUTTON AND NOT A TRIGGER
#
# The obvious design is "push to main, version has no tag, mint it". That was
# proposed and rejected, on evidence from this repository: the v0.15.0 release PR
# merged as 2f51d63, whose tree says workspace 0.15.0, bindings crate 0.6.0 and
# `pyproject.toml` 0.4.0 — the FND-044 wheel-label defect, live. Auto-minting at
# merge would have created v0.15.0 there, at the exact commit the maintainer then
# had to delete; the real tag sits two commits later at 1354fda, after the defect
# was found by hand-building the wheel. A rule of "never move a tag" would then
# have made the automation defend the defect against the fix.
#
# The pause between "release merged" and "release tagged" is where the only
# recent release defect was caught. This workflow keeps that pause and removes
# the other half of the risk instead: a human decides *that* a release is ready,
# and the machine decides *which commit* carries it, so the tag cannot land on a
# commit the maintainer merely remembered.
#
# The one exception is the `sha` input (FND-322): when merges after the release
# PR must not ship, the human names the release commit, and every check below
# runs at it exactly as at the tip. Without it, a release left past
# check-release-tags.py's MAX_UNTAGGED_AGE_DAYS could not be minted at all — the
# tip's [Unreleased] blocks the mint, and the age check fails the docs PR that
# would clear it — and v0.25.0 was tagged by hand for that reason.
#
# `contents: write` is scoped to the one job that needs it, following
# benchmark-dashboard.yml — but deliberately NOT its toolchain idiom. This job
# installs no toolchain and builds nothing: a job whose token can rewrite release
# history must not also run build scripts and proc macros from the dependency
# tree. Its entire third-party surface is one SHA-pinned checkout.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g. 0.16.0). Defaults to the workspace version on main.'
        required: false
        type: string
      sha:
        description: 'Commit to tag: a full 40-hex SHA that is an ancestor of main. Default: main''s tip. Use when merges after the release PR must NOT ship in this release (docs/release-process.md step 1).'
        required: false
        type: string

permissions:
  contents: read

# No cancel-in-progress. Cancelling a half-finished mint is how a tag ends up
# pushed with its verification skipped, or not pushed at all with the run
# reported as superseded rather than failed.
concurrency:
  group: mint-release-tag
  cancel-in-progress: false

jobs:
  mint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Job-level `permissions:` replaces the entire map rather than adding to it,
      # so without this the token has contents + metadata and nothing else. The
      # check-runs gate below reads an API that happens to answer unauthenticated
      # while this repository is public — i.e. it would pass for a reason that
      # disappears the day it goes private, on the one step no run has exercised.
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      # Before anything depends on it: the resolver decides which commit this
      # token tags, and its refusals are seen failing here first — the same
      # reason the last step runs test-check-release-tags.py (FND-322). Python
      # and git only; it adds nothing to this job's third-party surface.
      - name: The resolver refuses what it should
        run: python3 scripts/test-mint-resolve.py

      - name: Resolve the version and the commit to tag
        id: resolve
        # Both inputs through env, never `${{ }}` into the shell line: `sha` is
        # free text from the dispatch form, and mint-resolve.py refuses anything
        # that is not 40 hex before it reaches git. Tip mode by default; the
        # rules for both modes, and why the tip is the default, are in the script.
        # In sha mode the script also writes the commits left out of the tag to
        # the log and the step summary.
        run: |
          set -euo pipefail
          python3 scripts/mint-resolve.py >> "$GITHUB_OUTPUT"
        env:
          REQUESTED: ${{ inputs.version }}
          SHA_INPUT: ${{ inputs.sha }}

      - name: Refuse to re-tag
        env:
          # Through env, not `${{ }}` into the shell line. The value reaches here
          # from Cargo.toml via tomllib, so an arbitrary TOML string could carry
          # shell metacharacters. Writing it requires a commit on main — already
          # privileged — but this is the repository's one privileged workflow, and
          # steps 1 and 5 already take the safer form.
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists. This workflow never moves or deletes a tag."
            exit 1
          fi

      # Everything below runs BEFORE the tag is pushed. Verifying afterwards
      # would leave a red job standing next to a published bad tag, which is
      # worse than no automation: the workflow may not delete it.
      - name: Verify the commit deserves the tag
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          git worktree add -q /tmp/mint "$SHA"

          # A changelog section must exist. The docs gate that requires one runs
          # only on pull requests; since 2026-09-27 the CI jobs are required
          # status checks on main (FND-068), but a tag can still name a commit
          # that reached main another way, so this checks the tree itself.
          grep -qE "^## \[${VERSION//./\\.}\]" /tmp/mint/docs/changelog.md \
            || { echo "::error::no [$VERSION] section in docs/changelog.md"; exit 1; }
          grep -qE "^## ${VERSION//./\\.}( |$)" /tmp/mint/docs/releasenotes.md \
            || { echo "::error::no $VERSION section in docs/releasenotes.md"; exit 1; }

          # In tip mode anything merged after the release PR is in the tag, and its
          # entry must have moved under [$VERSION] first (release-process step 1).
          # Missed at 0.19.0, 0.20.0 and 0.23.0, each fixed after the tag. In sha
          # mode this reads the tagged commit's own [Unreleased], so later merges'
          # entries — which are not in the tag — do not block it.
          ( cd /tmp/mint && python3 "$GITHUB_WORKSPACE/scripts/check-changelog-unreleased-empty.py" )

          # The defect that made this a button rather than a trigger. The script
          # comes from THIS checkout and runs against the target tree: an older
          # commit may not contain the checker at all — 2f51d63 does not — and
          # `python3: can't open file` is a failure for the wrong reason.
          ( cd /tmp/mint && python3 "$GITHUB_WORKSPACE/scripts/check-binding-version.py" )

          # The SBOM must describe THIS release: every workspace member at
          # $VERSION. The version-bump gate only requires the file to change on a
          # bumping PR; nothing looked inside it before a tag (FND-068). Same
          # this-checkout-against-target-tree pattern as above; the checker's own
          # version parser is imported from beside it.
          ( cd /tmp/mint && python3 "$GITHUB_WORKSPACE/scripts/check-sbom-version.py" )

      - name: Require CI green at that commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # `mint` is this job's id (the job has no `name:`), and the filter
          # excludes it so a previous failed attempt at the same SHA cannot wedge a
          # retry. Renaming the job — or giving it a display name — makes the gate
          # see its own null-conclusion run and the workflow can then never pass.
          #
          # --paginate because the default page is 30: past that, a failure on page
          # two would be unseen, and this gate must not fail open.
          CONCLUSION=$(gh api --paginate "repos/${{ github.repository }}/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name != "mint")] | if length == 0 then "none" else (if any(.conclusion != "success") then "failed" else "success" end) end')
          echo "check-runs at $SHA: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI is not green at $SHA ($CONCLUSION) — refusing to tag it"
            exit 1
          fi

      - name: Build the tag message
        run: |
          set -euo pipefail
          # Via a file, never interpolated into a shell line: the content comes
          # from the changelog and must not be able to become shell.
          #
          # The whole section body, not just its heading — roughly 29 kB for a
          # release like 0.15.0. Large for a tag message, deliberately: `git tag -n`
          # shows only the first line, the rest is there for `git show`, and the
          # alternative is a one-line summary that loses every breaking-change
          # notice the section carries.
          python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"]
          text = pathlib.Path("/tmp/mint/docs/changelog.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                        text, re.MULTILINE | re.DOTALL)
          heading = re.search(rf"^## \[{re.escape(version)}\]([^\n]*)", text, re.MULTILINE)
          title = (heading.group(1) if heading else "").strip(" —-")
          body = (m.group(1).strip() if m else "")
          trailer = (f"Tagged by .github/workflows/release-tag.yml from the changelog "
                     f"section. Fuller prose lives in docs/releasenotes.md.")
          if os.environ["MODE"] == "sha":
              # The tag says it was not cut from the tip, and what it leaves out,
              # so `git show` answers that without the workflow log (FND-322).
              trailer += (f" Minted at an explicitly requested commit; main's tip at "
                          f"mint time was {os.environ['TIP']}, {os.environ['BEHIND']} "
                          f"later commit(s) are not in this release.")
          pathlib.Path("/tmp/tagmsg").write_text(
              f"v{version}{(' — ' + title) if title else ''}\n\n"
              f"{body}\n\n"
              f"{trailer}\n",
              encoding="utf-8",
          )
          PY
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          MODE: ${{ steps.resolve.outputs.mode }}
          TIP: ${{ steps.resolve.outputs.tip }}
          BEHIND: ${{ steps.resolve.outputs.behind }}

      - name: Mint and push the annotated tag
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Tag the resolved SHA explicitly. Tagging HEAD or origin/main would
          # reintroduce a race; a SHA is immutable.
          # --cleanup=verbatim, and it is not optional. git's default for -F is
          # `strip`, which deletes every line beginning with `#` as commentary —
          # and a Keep-a-Changelog body is structured by exactly those: `### Added`,
          # `### Fixed`, `### Removed`. Without this the four categorised lists
          # merge into one undifferentiated stream in which a breaking change and a
          # bugfix are indistinguishable. Verified in a scratch repo: the headings
          # vanish silently, message accepted, tag created.
          git tag -a "v$VERSION" "$SHA" -F /tmp/tagmsg --cleanup=verbatim
          git push origin "refs/tags/v$VERSION"
          echo "minted v$VERSION at $SHA"

      # A tag created with GITHUB_TOKEN does NOT trigger workflows, so ci.yml's
      # `push: tags: ['v*']` will not fire for this tag. That trigger still earns
      # its place — it covers hand-pushed and hand-moved tags, which are the only
      # kind that have actually been defective here. This step is its stand-in.
      - name: Verify the tag we just made
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          python3 scripts/test-check-release-tags.py
          python3 scripts/check-release-tags.py
