name: CI

# Core quality gates. These mirror the local .githooks/ but run on every push
# and pull request so they cannot be bypassed with --no-verify or a missing
# core.hooksPath. Each job runs a single gate command directly (no pipes, no
# `|| true`) so a non-zero exit fails the job.
#
# The Rust toolchain is PINNED (dtolnay/rust-toolchain@1.97.1) rather than
# @stable: a `-D warnings` clippy gate on a rolling stable is not reproducible
# — a new Rust release can turn CI red with no code change (e.g. 1.98.0 added
# clippy::needless_late_init). Bump the pin deliberately in its own PR and fix
# any new lints there.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-deny
      # Advisories are covered by the cargo-audit job; here we enforce the
      # license / bans / sources policy in deny.toml (no redundant advisory run).
      - run: cargo deny check bans licenses sources

  bindings:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      # Pinned to the newest CPython pyo3 0.23 supports. A newer interpreter makes
      # the build fail outright (PYO3_USE_ABI3_FORWARD_COMPATIBILITY is a local
      # escape hatch, not something to gate on), so the pin moves when pyo3 does.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: bindings/fnec_py
      # `bindings/fnec_py` is deliberately excluded from the cargo workspace (it is
      # a cdylib with its own lockfile), so every --workspace job above skips it.
      # Without this job it can be broken by any nec_solver API change and nothing
      # notices until someone builds a wheel by hand.
      - name: rustfmt
        working-directory: bindings/fnec_py
        run: cargo fmt --check
      - name: clippy -D warnings
        working-directory: bindings/fnec_py
        run: cargo clippy --all-targets -- -D warnings
      - name: Install maturin and pytest
        run: pip install "maturin>=1.5,<2" pytest
      - name: Build and install the extension module
        working-directory: bindings/fnec_py
        run: maturin build --out dist && pip install --no-index --find-links dist fnec_py
      - name: pytest
        run: pytest bindings/fnec_py/tests -q

  docs:
    name: docs contract
    runs-on: ubuntu-latest
    steps:
      # Full history so the version-bump gate can diff base against head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate docs frontmatter
        run: bash scripts/validate-docs-frontmatter.sh
      - name: Traceability matrix is generated and fresh
        run: python3 scripts/gen-traceability-matrix.py --check
      # Per-case corpus provenance is derived from git history, so it must be
      # re-derived when a case is added or its stored values change. Without this
      # a new case ships with no provenance at all, which is how the file came to
      # claim one engine version for 48 cases produced across six.
      - name: Corpus per-case provenance is derived and fresh
        run: python3 scripts/derive-corpus-provenance.py --check
      # Findings ledger row shape: a deferred finding must name an owner, a fixed
      # one must cite the change that fixed it. Without this the states decay into
      # rows that only look resolved.
      - name: Findings ledger rows are well-formed
        run: python3 scripts/check-findings-ledger.py
      # Path inventory references must resolve: a cited test that has been renamed
      # away, or a gap row linking to no finding, turns the inventory into a
      # coverage claim backed by nothing.
      - name: Path inventory references resolve
        run: python3 scripts/check-path-inventory.py
      # Entries are added one PR at a time and each brings its own heading, so a
      # release section drifts into `### Fixed` three times over. Caught only on
      # release day twice; now caught on the PR that causes it.
      - name: Changelog headings are not duplicated
        run: python3 scripts/check-changelog-headings.py
      - name: Require changelog + release notes + SBOM on a version bump
        if: github.event_name == 'pull_request'
        run: >-
          bash scripts/check-version-bump-docs.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Line-coverage floor. On this headless runner (no GPU adapter) the wgpu
      # dispatch paths stay uncovered, so line coverage is ~78% here vs ~84% on a
      # box with a software GPU. The floor is set against the reproducible CI
      # number with headroom; ratchet upward as coverage improves.
      - run: cargo llvm-cov --workspace --summary-only --fail-under-lines 75
