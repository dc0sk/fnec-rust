name: CI

# Core quality gates. These mirror the local .githooks/ but run on every push
# and pull request so they cannot be bypassed with --no-verify or a missing
# core.hooksPath. Each job runs a single gate command directly (no pipes, no
# `|| true`) so a non-zero exit fails the job.
#
# The Rust toolchain is PINNED (dtolnay/rust-toolchain@1.97.1) rather than
# @stable: a `-D warnings` clippy gate on a rolling stable is not reproducible
# — a new Rust release can turn CI red with no code change (e.g. 1.98.0 added
# clippy::needless_late_init). Bump the pin deliberately in its own PR and fix
# any new lints there.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-deny
      # Advisories are covered by the cargo-audit job; here we enforce the
      # license / bans / sources policy in deny.toml (no redundant advisory run).
      - run: cargo deny check bans licenses sources

  docs:
    name: docs contract
    runs-on: ubuntu-latest
    steps:
      # Full history so the version-bump gate can diff base against head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate docs frontmatter
        run: bash scripts/validate-docs-frontmatter.sh
      - name: Traceability matrix is generated and fresh
        run: python3 scripts/gen-traceability-matrix.py --check
      - name: Require changelog + release notes + SBOM on a version bump
        if: github.event_name == 'pull_request'
        run: >-
          bash scripts/check-version-bump-docs.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Line-coverage floor. Measured ~84% at review-260821 (default features;
      # SSH/GPU-adapter tests skip), so 80% leaves headroom while still catching a
      # real regression. Ratchet upward as coverage improves.
      - run: cargo llvm-cov --workspace --summary-only --fail-under-lines 80
