# Machine-readable requirements register — the single source of truth for the
# product-level requirements (join key: `id`).
#
# This file is DATA, not prose. It is consumed by:
#   * apps/nec-cli/tests/traceability.rs — the GAP/DANGLING checker that runs
#     inside `cargo test` (and therefore the CI test gate). It fails the build on
#     a requirement with verification="test" that no test cites, and on any
#     `// VERIFIES: <ID>` in the code that cites an id not registered here.
#   * scripts/gen-traceability-matrix.sh — regenerates the human-readable matrix
#     docs/project/traceability-matrix-generated.md from this file + the code
#     citations (do not hand-edit the generated file).
#
# Fields per [[requirement]]:
#   id            stable identifier (join key); referenced from code as `// VERIFIES: <id>`
#   title         one-line statement
#   status        implemented | partial | planned
#   criticality   high | medium | low
#   verification  test   — must be cited by at least one `// VERIFIES:` in a test
#                 review — verified by inspection/architecture (no code binding required);
#                          give a `rationale`
#
# Seeded with the FR/NFR product requirements (docs/requirements.md). Expand by
# adding entries and their `// VERIFIES:` citations; the checker enforces both
# directions for everything listed here.

